name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Install vcpkg and dependencies
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install nlohmann-json:x64-windows
      shell: powershell

    # Configure CMake with vcpkg toolchain and C++17
    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_CXX_STANDARD=17
      shell: powershell

    # Build project
    - name: Build
      run: cmake --build build --config Release
      shell: powershell

    # Package executable and DLLs
    - name: Package executable
      run: |
        mkdir artifact
        copy build\bin\Release\starmap3.exe artifact\
        copy build\bin\Release\*.dll artifact\ || echo "No extra DLLs"
      shell: powershell

    # Upload artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap3-windows
        path: artifact
