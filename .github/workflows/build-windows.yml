name: Build Windows EXE (SFML 2.6 via FetchContent)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  BUILD_TYPE: Debug  # Change to Release if desired

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v4

    # 2️⃣ Setup vcpkg and install dependencies (nlohmann-json only)
    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install nlohmann-json:x64-windows
      shell: powershell

    # 3️⃣ Configure CMake with vcpkg toolchain (SFML will come from FetchContent)
    - name: Configure CMake
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
      shell: powershell

    # 4️⃣ Build the project
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      shell: powershell

    # 5️⃣ Package executable and any DLLs
    - name: Package executable
      run: |
        mkdir artifact
        copy build\bin\${{ env.BUILD_TYPE }}\starmap3.exe artifact\
        Copy-Item "build\bin\${{ env.BUILD_TYPE }}\*.dll" artifact\ -ErrorAction SilentlyContinue
      shell: powershell

    # 6️⃣ Upload artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap3-windows-${{ env.BUILD_TYPE }}
        path: artifact
