name: Build Windows EXE (SFML 2.6)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  BUILD_TYPE: Debug  # Change to Release if needed

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v4

    # 2️⃣ Setup vcpkg and install dependencies
    - name: Setup vcpkg and install SFML 2.6
      run: |
        # Clone vcpkg
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat

        # Remove any existing SFML to avoid conflicts
        .\vcpkg\vcpkg remove sfml:x64-windows

        # Install SFML 2.6 and nlohmann-json
        .\vcpkg\vcpkg install sfml@2.6:x64-windows nlohmann-json:x64-windows
      shell: powershell

    # 3️⃣ Configure CMake with vcpkg toolchain
    - name: Configure CMake
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
      shell: powershell

    # 4️⃣ Build the project
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      shell: powershell

    # 5️⃣ Package executable and DLLs
    - name: Package executable
      run: |
        mkdir artifact
        copy build\bin\${{ env.BUILD_TYPE }}\starmap3.exe artifact\
        Copy-Item "build\bin\${{ env.BUILD_TYPE }}\*.dll" artifact\ -ErrorAction SilentlyContinue
      shell: powershell

    # 6️⃣ Upload artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap3-windows-${{ env.BUILD_TYPE }}
        path: artifact
