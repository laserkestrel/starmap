name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install nlohmann-json:x64-windows
      shell: powershell

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -G "Visual Studio 17 2022"
        -A x64
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
      shell: powershell

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}
      shell: powershell

    - name: Package executable
      run: |
        mkdir artifact
        copy build\bin\${{ env.BUILD_TYPE }}\starmap3.exe artifact\
        Copy-Item "build\bin\${{ env.BUILD_TYPE }}\*.dll" artifact\ -ErrorAction SilentlyContinue
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap3-windows-${{ env.BUILD_TYPE }}
        path: artifact
