name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    # CMake copies ./content next to the executable as a post-build step, so the
    # build output directory is already a runnable layout. Take all of it rather
    # than naming individual files, which is how content came to be missing.
    - name: Package executable
      run: |
        New-Item -ItemType Directory -Force -Path artifact | Out-Null
        Copy-Item build\bin\Release\* artifact\ -Recurse -Force

    # Fail here rather than silently shipping a build that cannot start.
    - name: Verify the artifact is runnable
      run: |
        $required = @(
          'starmap.exe',
          'content\hygdata_v40.csv',
          'content\config.json',
          'content\Frontier.ttf'
        )
        foreach ($f in $required) {
          if (-not (Test-Path (Join-Path 'artifact' $f))) { throw "Missing from artifact: $f" }
        }
        Get-ChildItem artifact -Recurse -File |
          Select-Object Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: starmap-windows
        path: artifact
